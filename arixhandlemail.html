<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arix Admin | Root Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { background-color: #000; color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow-x: hidden; }
    .neon-border { box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.4); }
    .grid-bg { background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; }
  </style>
</head>
<body class="min-h-screen grid-bg flex items-center justify-center p-6">

  <!-- Auth Screen -->
  <div id="auth-panel" class="bg-[#0a0a0a] p-8 rounded-xl neon-border max-w-sm w-full text-center relative z-10">
    <i class="ph-fill ph-shield-warning text-5xl text-purple-500 mb-4 inline-block"></i>
    <h1 class="text-xl font-bold uppercase tracking-widest mb-2">Root Access</h1>
    <p class="text-xs text-gray-500 mb-6">Enter Master Secret Key</p>
    <input type="password" id="admin-secret" class="w-full bg-black border border-purple-500/30 rounded px-4 py-3 text-white text-center focus:outline-none focus:border-purple-500 mb-4" placeholder="••••••••">
    <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded transition-colors uppercase text-sm tracking-wider">Authorize</button>
    <p id="auth-err" class="text-red-500 text-xs mt-4 hidden"></p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden w-full h-[90vh] max-w-6xl flex flex-col gap-6 relative z-10">
    <header class="bg-[#0a0a0a] border border-gray-800 p-4 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="ph-fill ph-terminal-window text-purple-500 text-2xl"></i>
        <h1 class="text-lg font-bold tracking-widest uppercase">Arix Oversight Matrix</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="fetchUsers()" class="text-xs bg-gray-800 px-3 py-1.5 rounded hover:bg-gray-700 flex items-center gap-2"><i class="ph-bold ph-arrows-clockwise"></i> Refresh</button>
        <button onclick="location.reload()" class="text-xs text-red-500 hover:text-red-400 border border-red-500/30 px-3 py-1.5 rounded">Exit</button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 min-h-0">
      
      <!-- Users Table -->
      <div class="md:col-span-2 bg-[#0a0a0a] border border-gray-800 rounded-xl flex flex-col overflow-hidden">
        <div class="p-4 border-b border-gray-800 bg-[#111] flex justify-between items-center">
          <h2 class="text-sm font-bold text-gray-400 uppercase">Active Identities</h2>
          <span class="text-xs bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded border border-purple-500/30" id="user-count">0 Nodes</span>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
          <table class="w-full text-left text-xs">
            <thead class="text-gray-500 border-b border-gray-800">
              <tr>
                <th class="pb-2">Handle</th>
                <th class="pb-2">Device Sig</th>
                <th class="pb-2">Last Sync</th>
                <th class="pb-2 text-right">Status / Action</th>
              </tr>
            </thead>
            <tbody id="user-tbody" class="text-gray-300 divide-y divide-gray-800/50">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Broadcast Module -->
      <div class="bg-[#0a0a0a] border border-gray-800 rounded-xl p-4 flex flex-col">
        <h2 class="text-sm font-bold text-gray-400 uppercase mb-4 border-b border-gray-800 pb-2 flex items-center gap-2"><i class="ph-bold ph-broadcast"></i> Global Push</h2>
        <p class="text-[10px] text-gray-500 mb-4">Injects System UI payloads directly into every registered user's inbox.</p>
        
        <input type="text" id="bc-subject" placeholder="Alert Subject" class="w-full bg-black border border-gray-800 rounded px-3 py-2 text-white mb-3 text-xs outline-none focus:border-purple-500">
        <textarea id="bc-content" placeholder="Standard Text Content..." class="w-full bg-black border border-gray-800 rounded px-3 py-2 text-white mb-3 text-xs h-20 outline-none focus:border-purple-500 resize-none"></textarea>
        <textarea id="bc-html" placeholder="Optional HTML/UI Payload to render natively inside the client..." class="w-full bg-[#111] border border-purple-900/30 rounded px-3 py-2 text-purple-300 mb-4 text-[10px] h-32 outline-none focus:border-purple-500 resize-none font-mono"></textarea>
        
        <button onclick="broadcast()" id="btn-bc" class="w-full mt-auto bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded transition-colors text-xs uppercase flex items-center justify-center gap-2">
          <i class="ph-bold ph-paper-plane-tilt"></i> Execute Push
        </button>
      </div>

    </div>
  </div>

  <script>
    let secret = "";
    
    async function login() {
      const pwd = document.getElementById('admin-secret').value;
      if(!pwd) return;
      document.getElementById('auth-err').classList.add('hidden');
      
      try {
        const res = await fetch('/api/arixmail', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_get_users', adminKey: pwd })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          secret = pwd;
          document.getElementById('auth-panel').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.body.classList.remove('items-center');
          document.body.classList.add('items-start');
          renderUsers(data.users);
        } else { throw new Error("Access Denied"); }
      } catch(e) {
        document.getElementById('auth-err').innerText = e.message;
        document.getElementById('auth-err').classList.remove('hidden');
      }
    }

    async function fetchUsers() {
      if(!secret) return;
      try {
        const res = await fetch('/api/arixmail', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_get_users', adminKey: secret })
        });
        const data = await res.json();
        if (data.success) renderUsers(data.users);
      } catch(e) { console.error(e); }
    }

    function renderUsers(users) {
      document.getElementById('user-count').innerText = `${users.length} Nodes`;
      document.getElementById('user-tbody').innerHTML = users.map(u => {
        const isBlocked = u.status === 'blocked';
        return `
          <tr class="hover:bg-white/5 transition-colors">
            <td class="py-3 font-bold text-white">${u.email}</td>
            <td class="py-3 text-gray-500 text-[10px]">${u.deviceId}</td>
            <td class="py-3 text-gray-500">${new Date(u.lastActive).toLocaleString()}</td>
            <td class="py-3 text-right">
              ${isBlocked ? 
                `<button onclick="toggleStatus('${u.email}', 'unblock')" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded text-[10px] hover:bg-emerald-500/40">UNBLOCK</button>` : 
                `<button onclick="toggleStatus('${u.email}', 'block')" class="bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-1 rounded text-[10px] hover:bg-red-500/40">BLOCK</button>`
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleStatus(email, command) {
      if(!confirm(`Are you sure you want to ${command} ${email}?`)) return;
      try {
        await fetch('/api/arixmail', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_action', adminKey: secret, payload: { targetEmail: email, command } })
        });
        fetchUsers();
      } catch(e) { alert("Failed command."); }
    }

    async function broadcast() {
      const subject = document.getElementById('bc-subject').value;
      const content = document.getElementById('bc-content').value;
      const uiHtml = document.getElementById('bc-html').value;
      if(!subject || !content) return alert("Subject and content required.");

      const btn = document.getElementById('btn-bc');
      btn.innerText = "Executing...";

      try {
        const res = await fetch('/api/arixmail', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_broadcast', adminKey: secret, payload: { subject, content, uiHtml } })
        });
        const data = await res.json();
        if(data.success) {
          alert(`Successfully pushed to ${data.count} inboxes.`);
          document.getElementById('bc-subject').value = "";
          document.getElementById('bc-content').value = "";
          document.getElementById('bc-html').value = "";
        }
      } catch(e) { alert("Broadcast failed."); }
      
      btn.innerHTML = `<i class="ph-bold ph-paper-plane-tilt"></i> Execute Push`;
    }
  </script>
</body>
</html>
