<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LexisAI Gods-Eye</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #050505; color: #e5e5e5; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-b border-gray-800 pb-12px; }
    .brand { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: #38bdf8; }
    .model-selector { display: flex; background: #111; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 3px; gap: 4px; }
    .model-btn { flex: 1; background: transparent; border: none; color: #777; padding: 6px 0; font-size: 11px; font-weight: 700; border-radius: 7px; cursor: pointer; transition: all 0.2s ease; }
    .model-btn.active { background: #222; color: #38bdf8; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .context-box { background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px; font-size: 11px; color: #9ca3af; line-height: 1.4; }
    .context-box strong { color: #f3f4f6; }
    textarea { width: 100%; background: #111; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; color: #fff; font-size: 12px; outline: none; resize: none; height: 70px; }
    textarea:focus { border-color: #38bdf8; }
    button.action-btn { width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: #fff; font-weight: 700; font-size: 13px; padding: 10px; border-radius: 10px; cursor: pointer; transition: opacity 0.2s; }
    button.action-btn:hover { opacity: 0.9; }
    button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 10px; text-align: center; color: #6b7280; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand"><span>LexisAI</span> Gods-Eye</div>
  </div>

  <!-- Model Selection (Spark, Flux, Oracle) -->
  <div class="model-selector">
    <button class="model-btn active" data-model="oracle">Oracle 2.0</button>
    <button class="model-btn" data-model="flux">Flux 1.5</button>
    <button class="model-btn" data-model="spark">Spark (Free)</button>
  </div>

  <!-- Page Context Info -->
  <div class="context-box" id="context-info">
    Reading active tab page structure...
  </div>

  <!-- User Query Input -->
  <textarea id="extension-input" placeholder="Ask anything about this page or query LexisAI..."></textarea>

  <button class="action-btn" id="analyze-btn">Analyze Web Page</button>
  <div class="status" id="status-text">Connected to Vercel Endpoint</div>

  <script src="popup.js"></script>
</body>
</html>
