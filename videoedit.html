
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>ArixVid — Browser Video Editor</title>
<style>
:root{--bg:#070a10;--panel:#0d121c;--panel2:#111827;--panel3:#151d2a;--line:#253043;--text:#eef4ff;--muted:#8e9bb2;--accent:#6ea8ff;--accent2:#8b7cff;--good:#38d39f;--warn:#f6c85f;--danger:#ff6b7a;--r:12px;--shadow:0 12px 38px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Inter,Segoe UI,system-ui,-apple-system,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}button{color:inherit;background:#141c29;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}button:hover{border-color:#43628e;background:#192337}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#274e8e;border-color:#4d77bd}button.good{background:#16483c;border-color:#276e5a}button.danger{background:#4b2028;border-color:#7e3944}.icon{padding:6px 8px;min-width:34px}.small{font-size:11px}.muted{color:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace}.hidden{display:none!important}
#app{display:grid;grid-template-rows:48px 1fr;grid-template-columns:300px 1fr 330px;height:100vh}.topbar{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#090d15;z-index:20}.brand{font-weight:800;letter-spacing:.4px;margin-right:14px}.brand span{color:var(--accent)}.top-group{display:flex;gap:5px;align-items:center}.top-spacer{flex:1}.status{display:flex;gap:10px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sidebar,.inspector{background:var(--panel);border-right:1px solid var(--line);min-width:0;overflow:auto}.inspector{border-right:0;border-left:1px solid var(--line)}.panel-head{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,18,28,.95);backdrop-filter:blur(12px);z-index:8}.tabs{display:flex;gap:4px;padding:7px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs button{padding:6px 8px;background:transparent;border-color:transparent;color:var(--muted)}.tabs button.active{background:#162238;border-color:#294362;color:var(--text)}
#mediaPanel{padding:8px}.media-toolbar{display:flex;gap:5px;margin-bottom:8px}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.media-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:grab}.media-item.sel{outline:2px solid var(--accent)}.thumb{aspect-ratio:16/9;background:#03050a;display:grid;place-items:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.media-meta{padding:6px 7px}.media-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-row{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-top:3px}
#main{display:grid;grid-template-rows:minmax(280px,46vh) 44px 1fr;min-width:0;background:#080c14}.preview-wrap{position:relative;background:#03050a;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview-toolbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(8,12,20,.78);border:1px solid rgba(255,255,255,.08);padding:7px;border-radius:10px;backdrop-filter:blur(10px);z-index:5}.preview-toolbar .grow{flex:1}.timecode{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}.canvas-shell{position:relative;max-width:96%;max-height:90%;box-shadow:var(--shadow);background:#000}.canvas-shell canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}.overlay{position:absolute;inset:0;pointer-events:none}.guide{position:absolute;background:rgba(255,255,255,.25)}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}.safe-box{position:absolute;inset:10%;border:1px dashed rgba(255,255,255,.2)}.timeline-toolbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0a0f18}.timeline-toolbar .grow{flex:1}.tl{position:relative;overflow:auto;background:#080c13}.tl-inner{min-width:100%;height:100%;position:relative}.ruler{height:30px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;background:#0b1019}.tick{position:absolute;top:0;height:100%;border-left:1px solid #273244;color:#6f7d94;font-size:9px;padding:2px 0 0 3px}.tracks{position:relative}.track-row{height:72px;border-bottom:1px solid var(--line);position:relative;display:flex}.track-head{position:sticky;left:0;width:92px;min-width:92px;background:#0c111b;border-right:1px solid var(--line);z-index:7;padding:7px}.track-head .name{font-weight:700}.track-actions{display:flex;gap:3px;margin-top:5px}.track-actions button{font-size:10px;padding:3px 5px}.track-content{position:relative;flex:1;min-width:1200px}.clip{position:absolute;top:7px;height:58px;border-radius:8px;border:1px solid #345071;background:linear-gradient(180deg,#1a2a42,#111a29);overflow:hidden;user-select:none;cursor:pointer}.clip.sel{outline:2px solid var(--accent)}.clip.invalid{border-color:var(--danger)}.clip-thumb{position:absolute;inset:0;opacity:.34;background-size:cover;background-position:center}.clip-wave{position:absolute;left:0;right:0;bottom:0;height:30%;opacity:.35;background-size:100% 100%}.clip-label{position:absolute;left:7px;right:7px;top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}.clip-badges{position:absolute;left:6px;bottom:5px;display:flex;gap:4px}.badge{font-size:9px;padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.45)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff5e72;z-index:12;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;border-radius:2px 2px 7px 7px;background:#ff5e72}.selection-box{position:absolute;border:1px dashed var(--accent);background:rgba(110,168,255,.08);pointer-events:none}
.section{padding:10px;border-bottom:1px solid var(--line)}.section h3{margin:0 0 8px;font-size:12px}.field{margin-bottom:9px}.field>label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input[type=text],.field input[type=number],.field input[type=range],.field select,.field textarea{width:100%}input,select,textarea{background:#0a1019;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px}input[type=range]{padding:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.row{display:flex;gap:6px;align-items:center}.row>.grow{flex:1}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:5px 7px;border:1px solid var(--line);border-radius:999px;background:#0b121d;color:#b8c5d8;font-size:10px;cursor:pointer}.chip.active{background:#19305b;color:#fff;border-color:#3a5e98}.panel-note{padding:8px 10px;color:var(--muted);font-size:10px;background:#0a0f17;border-bottom:1px solid var(--line)}.kv{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:10px}.kv div:nth-child(odd){color:var(--muted)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);z-index:50}.modal.open{display:grid}.modal-card{width:min(940px,92vw);max-height:88vh;overflow:auto;background:#0d131e;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.5)}.modal-head{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:13px}.command-list{display:grid;gap:6px}.command-item{padding:9px;border:1px solid var(--line);border-radius:8px;background:#111925;cursor:pointer}.command-item:hover{background:#172235;border-color:#41618c}.toast-stack{position:fixed;right:16px;bottom:16px;display:grid;gap:7px;z-index:80}.toast{background:#111925;border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-shadow:var(--shadow);max-width:380px}.progress{height:8px;background:#0a0e15;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.drop-zone{border:1px dashed #38527b;border-radius:12px;padding:18px;text-align:center;color:var(--muted);margin:8px 0;background:#0a1019}.drop-zone.drag{border-color:var(--accent);background:#101a2a;color:var(--text)}
.inspector .section{padding:10px 11px}.inspector-scroll{height:100%;overflow:auto}.histogram{width:100%;height:90px;background:#070a10;border:1px solid var(--line);border-radius:7px}.curve{width:100%;height:180px;background:#070a10;border:1px solid var(--line);border-radius:7px;cursor:crosshair}.scope-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.scope{width:100%;height:120px;background:#070a10;border:1px solid var(--line);border-radius:7px}.timeline-search{width:190px}.footer-hint{padding:8px 10px;color:#72809a;font-size:10px;border-top:1px solid var(--line)}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feature{padding:7px;border:1px solid var(--line);background:#0b111a;border-radius:7px;font-size:10px}.feature b{display:block;margin-bottom:2px}.pill{display:inline-block;font-size:9px;padding:2px 5px;border-radius:999px;background:#113629;color:#73dfba;border:1px solid #275d4f}.warn-pill{background:#3d3013;color:#f2d17b;border-color:#655024}.kbd{border:1px solid #37465d;padding:1px 4px;border-radius:4px;font-size:9px;background:#101722;color:#aab8cb}
@media(max-width:1050px){#app{grid-template-columns:240px 1fr}.inspector{position:fixed;right:0;top:48px;bottom:0;width:330px;transform:translateX(100%);transition:.2s;z-index:30}.inspector.open{transform:none}.topbar{grid-column:1/3}}@media(max-width:780px){#app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:48px;bottom:0;width:280px;transform:translateX(-100%);transition:.2s;z-index:30}.sidebar.open{transform:none}.topbar{grid-column:1}.preview-wrap{height:38vh}.timeline-toolbar{flex-wrap:wrap}.timeline-search{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">Arix<span>Vid</span></div>
  <div class="top-group">
    <button id="newProject">New</button><button id="openProject">Open</button><button id="saveProject">Save</button>
    <button id="importMedia" class="primary">Import</button><input id="fileInput" type="file" accept="video/*,audio/*,image/*,.webm,.mp4,.mov,.m4v,.mkv,.mp3,.wav,.ogg,.aac,.flac,.png,.jpg,.jpeg,.webp,.gif,.svg" multiple hidden>
    <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
  </div>
  <div class="top-group">
    <button id="undoBtn" class="icon" title="Undo (Ctrl/Cmd+Z)">↶</button><button id="redoBtn" class="icon" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
    <button id="focusBtn">Focus</button><button id="commandBtn">⌘K</button>
  </div>
  <div class="top-spacer"></div>
  <div class="status"><span class="dot"></span><span id="statusText">Ready</span><span id="fpsText" class="muted">30 fps</span></div>
  <button id="exportBtn" class="good">Export</button>
  <button id="moreBtn" class="icon">⋯</button>
</header>
<aside class="sidebar">
  <div class="tabs" id="leftTabs">
    <button class="active" data-panel="media">Media</button><button data-panel="effects">Effects</button><button data-panel="text">Text</button><button data-panel="audio">Audio</button><button data-panel="shapes">Shapes</button><button data-panel="project">Project</button>
  </div>
  <div id="leftContent"></div>
</aside>
<main id="main">
  <div class="preview-wrap" id="previewWrap">
    <div class="canvas-shell" id="canvasShell"><canvas id="previewCanvas" width="1280" height="720"></canvas><div class="overlay" id="overlay"><div class="guide v" id="centerV" style="left:50%"></div><div class="guide h" id="centerH" style="top:50%"></div><div class="safe-box" id="safeBox"></div></div></div>
    <div class="preview-toolbar">
      <button id="playBtn" class="primary">▶</button><button id="prevFrame" class="icon">⏮</button><button id="nextFrame" class="icon">⏭</button><button id="homeBtn" class="icon">⌂</button><button id="endBtn" class="icon">⇥</button>
      <div class="timecode mono" id="timecode">00:00:00.000</div><div class="grow"></div>
      <select id="playbackRate" style="width:90px"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>4</option></select>
      <button id="loopBtn">Loop</button><button id="guidesBtn">Guides</button><button id="fullscreenBtn">Fullscreen</button>
    </div>
  </div>
  <div class="timeline-toolbar">
    <button id="selectTool" class="active">Select</button><button id="razorTool">Split</button><button id="handTool">Hand</button><button id="zoomOut">−</button><button id="zoomIn">+</button>
    <label class="row"><input id="snapToggle" type="checkbox" checked> Snap</label><select id="snapMode"><option value="all">All</option><option value="clip">Clips</option><option value="marker">Markers</option><option value="keyframe">Keyframes</option><option value="grid">Grid</option><option value="beat">Beat</option></select>
    <input id="timelineSearch" class="timeline-search" placeholder="Find clips or markers…"><div class="grow"></div><button id="fitTimeline">Fit</button><button id="markerBtn">Marker</button><button id="addTrackBtn">+ Track</button>
  </div>
  <section class="tl" id="timeline"><div class="tl-inner" id="tlInner"><div class="ruler" id="ruler"></div><div class="tracks" id="tracks"></div><div class="playhead" id="playhead"></div></div></section>
</main>
<aside class="inspector" id="inspector"><div class="panel-head"><b>Inspector</b><div class="row"><button id="closeInspector" class="icon">×</button></div></div><div class="inspector-scroll" id="inspectorContent"></div></aside>
</div>

<div class="modal" id="commandModal"><div class="modal-card"><div class="modal-head"><b>Command Palette</b><button data-close="commandModal">×</button></div><div class="modal-body"><input id="commandInput" autofocus placeholder="Try: split, freeze, zoom, color, export, 9:16…"><div id="commandList" class="command-list" style="margin-top:10px"></div></div></div></div>
<div class="modal" id="exportModal"><div class="modal-card"><div class="modal-head"><b>Export ArixVid Project</b><button data-close="exportModal">×</button></div><div class="modal-body" id="exportBody"></div></div></div>
<div class="modal" id="projectModal"><div class="modal-card"><div class="modal-head"><b>Project Settings</b><button data-close="projectModal">×</button></div><div class="modal-body" id="projectBody"></div></div></div>
<div class="modal" id="historyModal"><div class="modal-card"><div class="modal-head"><b>History</b><button data-close="historyModal">×</button></div><div class="modal-body" id="historyBody"></div></div></div>
<div class="modal" id="featuresModal"><div class="modal-card"><div class="modal-head"><b>ArixVid Feature Set</b><button data-close="featuresModal">×</button></div><div class="modal-body"><div class="panel-note">Implemented as deterministic browser algorithms or native media APIs. Codec and hardware availability are detected at runtime; unsupported export paths are not offered.</div><div id="featuresGrid" class="feature-grid"></div></div></div></div>
<div class="toast-stack" id="toastStack"></div>

<script src="videdit.js" defer></script>
</body></html>
